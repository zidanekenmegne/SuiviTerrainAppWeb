<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notifications - SuiviTerrain</title>
    <meta name="description" content="Consultez vos notifications SuiviTerrain.">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================
           STYLES GLOBAUX
           ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #FFF8F0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==========================================================
           BARRE DE NAVIGATION PC (> 768px)
           ========================================================== */
        .navbar-pc {
            background-color: #8B0000;
            padding: 0.75rem 1.5rem;
            display: none;
            flex-shrink: 0;
        }

        .navbar-pc .navbar-brand {
            font-family: 'Segoe UI', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .navbar-pc .navbar-brand img {
            height: 30px;
        }

        .navbar-pc .navbar-brand span:first-child {
            color: #ffffff;
        }

        .navbar-pc .navbar-brand span:last-child {
            color: #C9A84C;
        }

        .navbar-pc .nav-links {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .navbar-pc .nav-links li a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: background-color 0.2s;
            font-size: 0.95rem;
        }

        .navbar-pc .nav-links li a:hover,
        .navbar-pc .nav-links li a.active {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .navbar-pc .nav-links li a i {
            margin-right: 0.4rem;
        }

        .navbar-pc .nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-left: auto;
        }

        /* ==========================================================
           BARRE DE RECHERCHE GÉNÉRALE (PC)
           ========================================================== */
        .search-container {
            position: relative;
            min-width: 220px;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 0.1rem 0.5rem;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .search-input-wrapper:focus-within {
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.3);
        }

        .search-input-wrapper i {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-right: 0.4rem;
            transition: color 0.2s;
        }

        .search-input-wrapper:focus-within i {
            color: #8B0000;
        }

        .search-input-wrapper input {
            background: transparent;
            border: none;
            padding: 0.45rem 0.3rem;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.85rem;
            color: #ffffff;
            outline: none;
            width: 100%;
            min-width: 140px;
        }

        .search-input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .search-input-wrapper:focus-within input {
            color: #1a1a1a;
        }

        .search-input-wrapper:focus-within input::placeholder {
            color: #6c757d;
        }

        .search-shortcut {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.1);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-family: 'Segoe UI', sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            white-space: nowrap;
        }

        .search-input-wrapper:focus-within .search-shortcut {
            color: #6c757d;
            background: #f0ece6;
            border-color: #e0dcd6;
        }

        .search-suggestions {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            max-height: 320px;
            overflow-y: auto;
            display: none;
            z-index: 10000;
            padding: 0.3rem 0;
        }

        .search-suggestions.visible {
            display: block;
        }

        .search-suggestions .suggestion-group-title {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.4rem 0.8rem 0.2rem 0.8rem;
            border-bottom: 1px solid #f0ece6;
        }

        .search-suggestions .suggestion-item {
            display: flex;
            align-items: center;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            transition: background-color 0.15s;
            border-radius: 6px;
            margin: 0.1rem 0.3rem;
            gap: 0.6rem;
        }

        .search-suggestions .suggestion-item:hover {
            background-color: #FFF8F0;
        }

        .search-suggestions .suggestion-item .suggestion-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #ffffff;
            font-size: 0.7rem;
        }

        .search-suggestions .suggestion-item .suggestion-icon.visit {
            background-color: #8B0000;
        }
        .search-suggestions .suggestion-item .suggestion-icon.point {
            background-color: #28a745;
        }
        .search-suggestions .suggestion-item .suggestion-icon.user {
            background-color: #17a2b8;
        }
        .search-suggestions .suggestion-item .suggestion-icon.planning {
            background-color: #ffc107;
            color: #1a1a1a;
        }

        .search-suggestions .suggestion-item .suggestion-info {
            flex: 1;
            min-width: 0;
        }

        .search-suggestions .suggestion-item .suggestion-info .suggestion-title {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.05rem;
        }

        .search-suggestions .suggestion-item .suggestion-info .suggestion-subtitle {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.65rem;
            color: #6c757d;
        }

        .search-suggestions .suggestion-item .suggestion-badge {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.55rem;
            font-weight: 600;
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .search-suggestions .suggestion-item .suggestion-badge.visit {
            background-color: #fce4e4;
            color: #8B0000;
        }
        .search-suggestions .suggestion-item .suggestion-badge.point {
            background-color: #e8f5e9;
            color: #28a745;
        }
        .search-suggestions .suggestion-item .suggestion-badge.user {
            background-color: #e3f2fd;
            color: #17a2b8;
        }
        .search-suggestions .suggestion-item .suggestion-badge.planning {
            background-color: #fff8e1;
            color: #f57c00;
        }

        .search-suggestions .suggestion-empty {
            padding: 1.5rem 0.8rem;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            color: #6c757d;
            font-size: 0.85rem;
        }

        .search-suggestions .suggestion-empty i {
            display: block;
            font-size: 2rem;
            margin-bottom: 0.3rem;
            color: #ced4da;
        }

        .search-suggestions::-webkit-scrollbar {
            width: 4px;
        }
        .search-suggestions::-webkit-scrollbar-track {
            background: #f8f5f0;
            border-radius: 4px;
        }
        .search-suggestions::-webkit-scrollbar-thumb {
            background: #c0b8b0;
            border-radius: 4px;
        }
        .search-suggestions::-webkit-scrollbar-thumb:hover {
            background: #8B0000;
        }

        /* ==========================================================
           CLOCHE DE NOTIFICATION (PC + Mobile)
           ========================================================== */
        .navbar-pc .nav-right .notification-btn,
        .top-header-mobile .header-right .notification-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.3rem;
            position: relative;
            padding: 0.25rem;
        }

        .navbar-pc .nav-right .notification-btn .badge-notif,
        .top-header-mobile .header-right .notification-btn .badge-notif {
            position: absolute;
            top: -4px;
            right: -6px;
            background-color: #dc3545;
            color: #fff;
            font-size: 0.5rem;
            font-weight: 700;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .navbar-pc .nav-right .dropdown-toggle {
            color: #ffffff;
            text-decoration: none;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .navbar-pc .nav-right .dropdown-toggle:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .navbar-pc .nav-right .dropdown-menu {
            border-radius: 12px;
            padding: 0.5rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            border: none;
        }

        .navbar-pc .nav-right .dropdown-item {
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 500;
        }

        .navbar-pc .nav-right .dropdown-item:hover {
            background-color: #FFF8F0;
        }

        .navbar-pc .nav-right .dropdown-item i {
            margin-right: 0.5rem;
        }

        /* ==========================================================
           BANDEAU HAUT MOBILE (< 768px)
           ========================================================== */
        .top-header-mobile {
            background: linear-gradient(135deg, #8B0000 0%, #6a0000 100%);
            padding: 0.75rem 1rem 0.5rem 1rem;
            border-radius: 0 0 1px 1px;
            display: none;
            flex-shrink: 0;
        }

        .top-header-mobile .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-header-mobile .back-button {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            padding: 0.25rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .top-header-mobile .back-button:hover {
            opacity: 0.8;
        }

        .top-header-mobile .header-center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .top-header-mobile .header-center .page-title {
            font-family: 'Segoe UI', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 0;
        }

        .top-header-mobile .header-right {
            display: flex;
            align-items: center;
        }

        .top-header-mobile .header-right .notification-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.3rem;
            position: relative;
            padding: 0.25rem;
        }

        .top-header-mobile .header-right .notification-btn .badge-notif {
            position: absolute;
            top: -4px;
            right: -6px;
            background-color: #dc3545;
            color: #fff;
            font-size: 0.5rem;
            font-weight: 700;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .top-header-mobile .menu-hamburger {
            display: none !important;
        }

        /* ==========================================================
           CONTENU PRINCIPAL
           ========================================================== */
        .main-content {
            flex: 1;
            padding: 1.25rem 1.25rem 5rem 1.25rem;
            background-color: #FFF8F0;
        }

        /* En-tête PC */
        .header-pc {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .header-pc h1 {
            font-family: 'Segoe UI', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: #1a1a1a;
            margin-bottom: 0;
        }

        .header-pc h1 i {
            color: #8B0000;
            margin-right: 0.4rem;
        }

        /* ==========================================================
           FILTRES
           ========================================================== */
        .filter-bar {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .filter-bar .filter-btn {
            padding: 0.3rem 0.9rem;
            border-radius: 20px;
            border: 1px solid #e0dcd6;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.2s;
            cursor: pointer;
        }

        .filter-bar .filter-btn:hover {
            border-color: #8B0000;
            color: #8B0000;
        }

        .filter-bar .filter-btn.active {
            background-color: #8B0000;
            border-color: #8B0000;
            color: #ffffff;
        }

        /* ==========================================================
           BOUTON "TOUT MARQUER COMME LU"
           ========================================================== */
        .mark-all-btn {
            background: none;
            border: none;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            color: #8B0000;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .mark-all-btn:hover {
            opacity: 0.7;
        }

        .mark-all-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        /* ==========================================================
           LISTE DES NOTIFICATIONS
           ========================================================== */
        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .notification-item {
            background: #ffffff;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            box-shadow: 0 2px 12px rgba(139, 0, 0, 0.04);
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
            transition: transform 0.15s, box-shadow 0.15s;
            border-left: 4px solid transparent;
            cursor: pointer;
        }

        .notification-item:hover {
            transform: translateX(4px);
            box-shadow: 0 4px 16px rgba(139, 0, 0, 0.06);
        }

        .notification-item.unread {
            border-left-color: #8B0000;
        }

        .notification-item.unread .notif-title {
            font-weight: 700;
        }

        .notification-item .notif-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.9rem;
            margin-top: 0.1rem;
        }

        .notification-item .notif-icon.visite {
            background-color: #8B0000;
        }
        .notification-item .notif-icon.rapport {
            background-color: #28a745;
        }
        .notification-item .notif-icon.alerte {
            background-color: #dc3545;
        }
        .notification-item .notif-icon.info {
            background-color: #17a2b8;
        }
        .notification-item .notif-icon.systeme {
            background-color: #ffc107;
            color: #1a1a1a;
        }

        .notification-item .notif-content {
            flex: 1;
            min-width: 0;
        }

        .notification-item .notif-content .notif-title {
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            color: #1a1a1a;
            margin-bottom: 0.05rem;
        }

        .notification-item .notif-content .notif-text {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.75rem;
            color: #6c757d;
            margin-bottom: 0.1rem;
        }

        .notification-item .notif-content .notif-date {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.6rem;
            color: #adb5bd;
        }

        .notification-item .notif-action {
            flex-shrink: 0;
            margin-left: 0.5rem;
        }

        .notification-item .notif-action .btn-mark-read {
            background: none;
            border: none;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            color: #8B0000;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .notification-item .notif-action .btn-mark-read:hover {
            opacity: 0.6;
        }

        /* ==========================================================
           FOOTER PC (fond rouge)
           ========================================================== */
        .footer-pc {
            background-color: #8B0000;
            padding: 1.5rem 1rem;
            text-align: center;
            flex-shrink: 0;
            display: none;
            margin-top: auto;
        }

        .footer-pc p {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.9rem;
            color: #ffffff;
            margin-bottom: 0;
            opacity: 0.85;
        }

        /* ==========================================================
           BARRE DE NAVIGATION MOBILE (< 768px)
           ========================================================== */
        .bottom-nav-mobile {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid #f0ece6;
            padding: 0.4rem 0.5rem 0.6rem 0.5rem;
            display: none;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 -2px 12px rgba(139, 0, 0, 0.06);
            flex-shrink: 0;
        }

        .bottom-nav-mobile .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #6c757d;
            font-size: 0.5rem;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
            padding: 0.15rem 0.3rem;
            border-radius: 8px;
            transition: color 0.2s;
            position: relative;
            min-width: 40px;
        }

        .bottom-nav-mobile .nav-item i {
            font-size: 1.2rem;
            margin-bottom: 0.05rem;
        }

        .bottom-nav-mobile .nav-item.active {
            color: #8B0000;
        }

        .bottom-nav-mobile .nav-item:hover {
            color: #8B0000;
        }

        .bottom-nav-mobile .nav-item-center {
            background: #8B0000;
            color: #fff;
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -14px;
            box-shadow: 0 4px 16px rgba(139, 0, 0, 0.3);
            transition: transform 0.2s;
            text-decoration: none;
        }

        .bottom-nav-mobile .nav-item-center:hover {
            transform: scale(1.05);
            color: #fff;
        }

        .bottom-nav-mobile .nav-item-center i {
            font-size: 1.6rem;
            margin-bottom: 0;
        }

        /* ==========================================================
           RESPONSIVE : POINT DE RUPTURE À 768px
           ========================================================== */
        @media (min-width: 769px) {
            .navbar-pc {
                display: flex !important;
                align-items: center;
                justify-content: space-between;
            }

            .top-header-mobile {
                display: none !important;
            }

            .bottom-nav-mobile {
                display: none !important;
            }

            .footer-pc {
                display: block !important;
            }

            .main-content {
                padding: 1.5rem 2rem 2rem 2rem;
                max-width: 900px;
                margin: 0 auto;
                width: 100%;
            }

            .header-pc h1 {
                font-size: 1.6rem;
            }

            .notification-item {
                padding: 1rem 1.25rem;
            }

            .notification-item .notif-content .notif-title {
                font-size: 0.9rem;
            }

            .notification-item .notif-content .notif-text {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 768px) {
            .top-header-mobile {
                display: block !important;
            }

            .bottom-nav-mobile {
                display: flex !important;
            }

            .navbar-pc {
                display: none !important;
            }

            .footer-pc {
                display: none !important;
            }

            .main-content {
                padding: 0.75rem 1rem 5rem 1rem;
            }

            .header-pc {
                display: none !important;
            }

            .filter-bar {
                gap: 0.3rem;
            }

            .filter-bar .filter-btn {
                font-size: 0.6rem;
                padding: 0.2rem 0.6rem;
            }

            .notification-item {
                padding: 0.6rem 0.75rem;
                gap: 0.5rem;
            }

            .notification-item .notif-icon {
                width: 30px;
                height: 30px;
                font-size: 0.7rem;
            }

            .notification-item .notif-content .notif-title {
                font-size: 0.75rem;
            }

            .notification-item .notif-content .notif-text {
                font-size: 0.65rem;
            }

            .notification-item .notif-content .notif-date {
                font-size: 0.55rem;
            }

            .bottom-nav-mobile .nav-item {
                font-size: 0.45rem;
                min-width: 32px;
            }

            .bottom-nav-mobile .nav-item i {
                font-size: 1rem;
            }

            .bottom-nav-mobile .nav-item-center {
                width: 44px;
                height: 44px;
                margin-top: -10px;
            }

            .bottom-nav-mobile .nav-item-center i {
                font-size: 1.3rem;
            }
        }

        /* ==========================================================
           ACCESSIBILITÉ
           ========================================================== */
        a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 3px solid #C9A84C;
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <!-- ==========================================================
    BARRE DE NAVIGATION PC (> 768px)
    ========================================================== -->
    <nav class="navbar-pc" aria-label="Navigation principale">
        <div style="display: flex; align-items: center; gap: 2rem;">
            <a class="navbar-brand" href="tableau-bord.html">
                <img src="../assets/images/favicon_io/favicon-16x16.png" alt="SuiviTerrain">

    <!-- ==========================================================
    SCRIPTS
    ========================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // ==========================================================
            // FLÈCHE RETOUR (mobile)
            // ==========================================================
            const backButton = document.getElementById('backButton');
            if (backButton) {
                backButton.addEventListener('click', function() {
                    window.history.back();
                });
            }

            // ==========================================================
            // NOTIFICATIONS - REDIRECTION VERS LA PAGE
            // ==========================================================
            const notifBtnPC = document.getElementById('notifBtnPC');
            const notifBtnMobile = document.getElementById('notifBtnMobile');

            function redirigerNotifications() {
                window.location.href = 'notifications.html';
            }

            if (notifBtnPC) {
                notifBtnPC.addEventListener('click', redirigerNotifications);
            }
            if (notifBtnMobile) {
                notifBtnMobile.addEventListener('click', redirigerNotifications);
            }

            // ==========================================================
            // DONNÉES FACTICES
            // ==========================================================
            let notifications = [{
                id: 1,
                type: 'visite',
                icon: 'bi bi-calendar-check',
                iconClass: 'visite',
                title: 'Nouvelle visite assignée',
                text: 'Vous avez une nouvelle visite : Évaluation des sols - Champ Ouest, Parcelle 7',
                date: 'il y a 2 heures',
                read: false,
                url: 'detail-visite.html'
            }, {
                id: 2,
                type: 'rapport',
                icon: 'bi bi-file-text',
                iconClass: 'rapport',
                title: 'Rapport soumis',
                text: 'Jean Dupont a soumis le rapport de la visite du 12 juin 2025',
                date: 'il y a 4 heures',
                read: false,
                url: 'rapport.html'
            }, {
                id: 3,
                type: 'alerte',
                icon: 'bi bi-exclamation-triangle',
                iconClass: 'alerte',
                title: 'Visite en retard',
                text: 'La visite de suivi client B est en retard de 2 heures',
                date: 'il y a 5 heures',
                read: false,
                url: 'detail-visite.html'
            }, {
                id: 4,
                type: 'info',
                icon: 'bi bi-info-circle',
                iconClass: 'info',
                title: 'Mise à jour disponible',
                text: 'Une nouvelle version de l\'application est disponible (v2.1.0)',
                date: 'hier à 10:30',
                read: true,
                url: '#'
            }, {
                id: 5,
                type: 'systeme',
                icon: 'bi bi-gear',
                iconClass: 'systeme',
                title: 'Maintenance planifiée',
                text: 'Le serveur sera en maintenance le 15 juin 2025 de 02:00 à 04:00',
                date: 'hier à 08:15',
                read: true,
                url: '#'
            }, {
                id: 6,
                type: 'visite',
                icon: 'bi bi-calendar-check',
                iconClass: 'visite',
                title: 'Visite réalisée',
                text: 'La visite commerciale Magasin A a été marquée comme réalisée',
                date: 'avant-hier à 16:45',
                read: true,
                url: 'detail-visite.html'
            }, {
                id: 7,
                type: 'rapport',
                icon: 'bi bi-file-text',
                iconClass: 'rapport',
                title: 'Rapport en attente',
                text: 'Vous avez 3 rapports en attente de validation',
                date: 'avant-hier à 09:20',
                read: true,
                url: 'rapports.html'
            }, {
                id: 8,
                type: 'alerte',
                icon: 'bi bi-exclamation-triangle',
                iconClass: 'alerte',
                title: 'Problème de connexion',
                text: 'Le mode hors ligne est activé, certaines données sont en attente de synchronisation',
                date: '3 jours',
                read: true,
                url: 'hors-ligne.html'
            }];

            // ==========================================================
            // MISE À JOUR DU BADGE
            // ==========================================================
            function updateBadge() {
                const unreadCount = notifications.filter(n => !n.read).length;
                const badges = document.querySelectorAll('.badge-notif');
                badges.forEach(badge => {
                    if (unreadCount === 0) {
                        badge.style.display = 'none';
                    } else {
                        badge.style.display = 'flex';
                        badge.textContent = unreadCount;
                    }
                });
            }

            // ==========================================================
            // MISE À JOUR DU BOUTON "TOUT MARQUER COMME LU"
            // ==========================================================
            function updateMarkAllButton() {
                const btn = document.getElementById('markAllBtn');
                const unreadCount = notifications.filter(n => !n.read).length;
                if (unreadCount === 0) {
                    btn.disabled = true;
                    btn.textContent = 'Tout est lu ✓';
                } else {
                    btn.disabled = false;
                    btn.textContent = `Tout marquer comme lu (${unreadCount})`;
                }
                updateBadge();
            }

            // ==========================================================
            // AFFICHAGE DES NOTIFICATIONS
            // ==========================================================
            const container = document.getElementById('notificationsList');
            let currentFilter = 'all';

            function renderNotifications(filter) {
                let filtered = notifications;
                if (filter === 'unread') {
                    filtered = notifications.filter(n => !n.read);
                } else if (filter === 'read') {
                    filtered = notifications.filter(n => n.read);
                }

                if (filtered.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 3rem 1rem; color: #6c757d;">
                            <i class="bi bi-inbox" style="font-size: 2.5rem; display: block; margin-bottom: 0.5rem; color: #ced4da;"></i>
                            <p style="font-family: 'Segoe UI', sans-serif; font-size: 0.9rem;">
                                ${filter === 'all' ? 'Aucune notification' : 
                                  filter === 'unread' ? 'Aucune notification non lue' : 
                                  'Aucune notification lue'}
                            </p>
                        </div>
                    `;
                    updateMarkAllButton();
                    return;
                }

                let html = '';
                filtered.forEach(n => {
                    const unreadClass = n.read ? '' : 'unread';
                    html += `
                        <div class="notification-item ${unreadClass}" data-id="${n.id}">
                            <div class="notif-icon ${n.iconClass}">
                                <i class="${n.icon}" aria-hidden="true"></i>
                            </div>
                            <div class="notif-content">
                                <div class="notif-title">${n.title}</div>
                                <div class="notif-text">${n.text}</div>
                                <div class="notif-date"><i class="bi bi-clock" aria-hidden="true"></i> ${n.date}</div>
                            </div>
                            <div class="notif-action">
                                ${!n.read ? `<button class="btn-mark-read" data-id="${n.id}">Marquer comme lu</button>` : ''}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

                // ==========================================================
                // ÉVÉNEMENTS : Marquer comme lu (individuel)
                // ==========================================================
                document.querySelectorAll('.btn-mark-read').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        const notif = notifications.find(n => n.id === id);
                        if (notif) {
                            notif.read = true;
                            renderNotifications(currentFilter);
                            updateMarkAllButton();
                        }
                    });
                });

                // ==========================================================
                // ÉVÉNEMENTS : Clic sur une notification
                // ==========================================================
                document.querySelectorAll('.notification-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const id = parseInt(this.dataset.id);
                        const notif = notifications.find(n => n.id === id);
                        if (notif) {
                            if (!notif.read) {
                                notif.read = true;
                                renderNotifications(currentFilter);
                                updateMarkAllButton();
                            }
                            if (notif.url && notif.url !== '#') {
                                window.location.href = notif.url;
                            }
                        }
                    });
                });

                updateMarkAllButton();
            }

            // ==========================================================
            // BOUTON "TOUT MARQUER COMME LU"
            // ==========================================================
            document.getElementById('markAllBtn').addEventListener('click', function() {
                const unread = notifications.filter(n => !n.read);
                if (unread.length === 0) return;

                if (confirm(`Marquer les ${unread.length} notification(s) non lue(s) comme lues ?`)) {
                    notifications.forEach(n => { n.read = true; });
                    renderNotifications(currentFilter);
                    updateMarkAllButton();
                }
            });

            // ==========================================================
            // FILTRES
            // ==========================================================
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderNotifications(currentFilter);
                });
            });

            // ==========================================================
            // RECHERCHE GÉNÉRALE
            // ==========================================================
            const searchInput = document.getElementById('globalSearchInput');
            const suggestionsContainer = document.getElementById('globalSearchSuggestions');

            if (searchInput && suggestionsContainer) {
                const searchData = {
                    visites: [
                        { id: 1, titre: 'Visite commerciale - Magasin A', adresse: 'Centre-ville',
                            date: '12 juin 2025', statut: 'Réalisée' },
                        { id: 2, titre: 'Collecte de commandes - Client B', adresse: 'Bonamoussadi',
                            date: '12 juin 2025', statut: 'En attente' },
                    ],
                    pointsVente: [
                        { id: 1, nom: 'Magasin A', adresse: 'Centre-ville', categorie: 'Alimentation' },
                        { id: 2, nom: 'Client B', adresse: 'Bonamoussadi', categorie: 'Services' },
                    ],
                    utilisateurs: [
                        { id: 1, nom: 'Zidane Fredy', email: 'zidane@suiviterrain.com', role: 'Administrateur' },
                        { id: 2, nom: 'Sarah Niong', email: 'sarah@suiviterrain.com', role: 'Agent' },
                    ],
                    planning: [
                        { id: 1, date: '12 juin 2025', agent: 'Zidane', visites: 3 },
                    ]
                };

                function performSearch(query) {
                    const term = query.toLowerCase().trim();
                    const results = [];
                    if (!term || term.length < 2) return results;

                    searchData.visites.forEach(v => {
                        if (v.titre.toLowerCase().includes(term) || v.adresse.toLowerCase().includes(term)) {
                            results.push({
                                type: 'visit',
                                label: v.titre,
                                subtitle: v.adresse + ' • ' + v.date,
                                badge: v.statut,
                                url: 'detail-visite.html?id=' + v.id,
                                icon: 'bi bi-calendar-event'
                            });
                        }
                    });

                    searchData.pointsVente.forEach(p => {
                        if (p.nom.toLowerCase().includes(term) || p.adresse.toLowerCase().includes(term)) {
                            results.push({
                                type: 'point',
                                label: p.nom,
                                subtitle: p.adresse + ' • ' + p.categorie,
                                badge: p.categorie,
                                url: 'detail-point.html?id=' + p.id,
                                icon: 'bi bi-shop'
                            });
                        }
                    });

                    searchData.utilisateurs.forEach(u => {
                        if (u.nom.toLowerCase().includes(term) || u.email.toLowerCase().includes(term)) {
                            results.push({
                                type: 'user',
                                label: u.nom,
                                subtitle: u.email + ' • ' + u.role,
                                badge: u.role,
                                url: 'gestion-utilisateurs.html',
                                icon: 'bi bi-person'
                            });
                        }
                    });

                    searchData.planning.forEach(p => {
                        if (p.date.toLowerCase().includes(term) || p.agent.toLowerCase().includes(term)) {
                            results.push({
                                type: 'planning',
                                label: 'Planning du ' + p.date,
                                subtitle: p.agent + ' • ' + p.visites + ' visites',
                                badge: p.visites + ' visites',
                                url: 'planning-visites.html?date=' + p.date,
                                icon: 'bi bi-calendar-check'
                            });
                        }
                    });

                    return results;
                }

                function renderSuggestions(results) {
                    const badges = { visit: 'visit', point: 'point', user: 'user', planning: 'planning' };
                    const icons = { visit: 'visit', point: 'point', user: 'user', planning: 'planning' };
                    const labels = { visit: 'Visites', point: 'Points de vente', user: 'Utilisateurs',
                    planning: 'Planning' };

                    if (results.length === 0) {
                        suggestionsContainer.innerHTML = `
                            <div class="suggestion-empty">
                                <i class="bi bi-search" aria-hidden="true"></i>
                                Aucun résultat trouvé
                            </div>
                        `;
                        suggestionsContainer.classList.add('visible');
                        return;
                    }

                    const grouped = { visit: [], point: [], user: [], planning: [] };
                    results.forEach(r => { if (grouped[r.type]) grouped[r.type].push(r); });

                    let html = '';
                    for (const [type, items] of Object.entries(grouped)) {
                        if (items.length === 0) continue;
                        html += `<div class="suggestion-group-title">${labels[type]}</div>`;
                        items.forEach(item => {
                            html += `
                                <div class="suggestion-item" data-url="${item.url}">
                                    <div class="suggestion-icon ${icons[item.type]}">
                                        <i class="${item.icon}" aria-hidden="true"></i>
                                    </div>
                                    <div class="suggestion-info">
                                        <div class="suggestion-title">${item.label}</div>
                                        <div class="suggestion-subtitle">${item.subtitle}</div>
                                    </div>
                                    <span class="suggestion-badge ${badges[item.type]}">${item.badge}</span>
                                </div>
                            `;
                        });
                    }

                    suggestionsContainer.innerHTML = html;
                    suggestionsContainer.classList.add('visible');

                    suggestionsContainer.querySelectorAll('.suggestion-item').forEach(el => {
                        el.addEventListener('click', function() {
                            const url = this.dataset.url;
                            if (url) window.location.href = url;
                        });
                    });
                }

                let searchTimeout;
                searchInput.addEventListener('input', function() {
                    clearTimeout(searchTimeout);
                    const query = this.value;
                    if (query.length < 2) {
                        suggestionsContainer.classList.remove('visible');
                        return;
                    }
                    searchTimeout = setTimeout(() => {
                        const results = performSearch(query);
                        renderSuggestions(results);
                    }, 250);
                });

                document.addEventListener('click', function(e) {
                    const container = document.getElementById('globalSearchContainer');
                    if (container && !container.contains(e.target)) {
                        suggestionsContainer.classList.remove('visible');
                    }
                });

                document.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                        e.preventDefault();
                        searchInput.focus();
                        searchInput.select();
                    }
                    if (e.key === 'Escape') {
                        suggestionsContainer.classList.remove('visible');
                        searchInput.blur();
                    }
                });

                let selectedIndex = -1;
                searchInput.addEventListener('keydown', function(e) {
                    const items = suggestionsContainer.querySelectorAll('.suggestion-item');
                    if (items.length === 0) return;

                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        selectedIndex = (selectedIndex + 1) % items.length;
                        items.forEach((el, i) => el.style.background = i === selectedIndex ? '#FFF8F0' : '');
                        if (selectedIndex >= 0) items[selectedIndex].scrollIntoView({ block: 'nearest' });
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        selectedIndex = (selectedIndex - 1 + items.length) % items.length;
                        items.forEach((el, i) => el.style.background = i === selectedIndex ? '#FFF8F0' : '');
                        if (selectedIndex >= 0) items[selectedIndex].scrollIntoView({ block: 'nearest' });
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        if (selectedIndex >= 0 && selectedIndex < items.length) {
                            const url = items[selectedIndex].dataset.url;
                            if (url) window.location.href = url;
                        }
                    }
                });
            }

            // ==========================================================
            // INITIALISATION
            // ==========================================================
            renderNotifications('all');
            updateBadge();
            console.log(' Page Notifications chargée');
        });
    </script>
