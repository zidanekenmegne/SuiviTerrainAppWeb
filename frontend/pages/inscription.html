<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inscription - SuiviTerrain</title>
    <meta name="description" content="Creez votre compte SuiviTerrain pour gerer vos visites et points de vente.">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages/inscription.css">
</head>
<body>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100">
            <div class="col-12 col-md-8 col-lg-5 mx-auto">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-4 p-md-5">
                        
                        <header class="text-center mb-4">
                            <img src="../assets/images/favicon_io/favicon.png" alt="Logo SuiviTerrain" height="60" class="mb-3">
                            <h1 class="h3 fw-bold">
                                <span class="suivi-text">Suivi</span><span class="terrain-text">Terrain</span>
                            </h1>
                            <p class="text-muted small">Creez votre compte</p>
                        </header>

                        <form id="form-inscription" novalidate aria-label="Formulaire d'inscription">
                            
                            <div class="mb-3">
                                <label for="nom" class="form-label fw-semibold">Nom complet</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-person" aria-hidden="true"></i>
                                    </span>
                                    <input type="text" class="form-control border-start-0" id="nom" 
                                           placeholder="Entrez votre nom complet" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-envelope" aria-hidden="true"></i>
                                    </span>
                                    <input type="email" class="form-control border-start-0" id="email" 
                                           placeholder="Entrez votre email" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="motdepasse" class="form-label fw-semibold">Mot de passe</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-lock" aria-hidden="true"></i>
                                    </span>
                                    <input type="password" class="form-control border-start-0 border-end-0" id="motdepasse" 
                                           placeholder="Creez un mot de passe" required>
                                    <button type="button" class="btn btn-light border-start-0" id="togglePassword" 
                                            aria-label="Afficher ou masquer le mot de passe">
                                        <i class="bi bi-eye" id="eyeIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="confirm_password" class="form-label fw-semibold">Confirmer le mot de passe</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-shield-lock" aria-hidden="true"></i>
                                    </span>
                                    <input type="password" class="form-control border-start-0" id="confirm_password" 
                                           placeholder="Confirmez votre mot de passe" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="role" class="form-label fw-semibold">Role</label>
                                <select class="form-select" id="role">
                                    <option value="agent">Agent commercial</option>
                                    <option value="admin">Administrateur</option>
                                </select>
                            </div>

                            <button type="submit" class="btn w-100 py-2 fw-bold text-white btn-inscrire">
                                S'inscrire
                            </button>
                        </form>

                        <div id="message-erreur" class="alert alert-danger mt-3 d-none" role="alert">
                            <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
                            <span id="erreur-texte">Erreur lors de l'inscription.</span>
                        </div>

                        <footer class="text-center mt-4">
                            <p class="small text-muted mb-0">Vous avez deja un compte ?</p>
                            <a href="connexion.html" class="text-decoration-none fw-semibold lien-connexion">Se connecter</a>
                        </footer>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/pages/inscription.js"></script>
</body>
</html>
