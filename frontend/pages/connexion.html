<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connexion - SuiviTerrain</title>
    <meta name="description" content="Connectez-vous a votre espace SuiviTerrain pour gerer vos visites et points de vente.">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Style global -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Style specifique -->
    <link rel="stylesheet" href="../css/pages/connexion.css">
</head>
<body>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100">
            <div class="col-12 col-md-8 col-lg-5 mx-auto">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-4 p-md-5">

                        <header class="text-center mb-4">
                            <img src="../assets/images/favicon_io/favicon.png" alt="Logo SuiviTerrain" height="60" class="mb-3">
                            <h1 class="h3 fw-bold">
                                <span class="suivi-text">Suivi</span><span class="terrain-text">Terrain</span>
                            </h1>
                            <p class="text-muted small">Suivez. Geerez. Performez.</p>
                        </header>

                        <form id="form-connexion" novalidate aria-label="Formulaire de connexion">

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-envelope" aria-hidden="true"></i>
                                    </span>
                                    <input type="email" class="form-control border-start-0" id="email"
                                           placeholder="Entrez votre email" required
                                           aria-describedby="emailHelp">
                                </div>
                                <div id="emailHelp" class="form-text">Nous ne partageons jamais votre email.</div>
                            </div>

                            <div class="mb-3">
                                <label for="motdepasse" class="form-label fw-semibold">Mot de passe</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-lock" aria-hidden="true"></i>
                                    </span>
                                    <input type="password" class="form-control border-start-0 border-end-0" id="motdepasse"
                                           placeholder="Entrez votre mot de passe" required>
                                    <button type="button" class="btn btn-light border-start-0" id="togglePassword"
                                            aria-label="Afficher ou masquer le mot de passe">
                                        <i class="bi bi-eye" id="eyeIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="se-souvenir">
                                    <label class="form-check-label small" for="se-souvenir">Se souvenir de moi</label>
                                </div>
                                <a href="#" class="small text-decoration-none fw-semibold lien-oubli">Mot de passe oublie ?</a>
                            </div>

                            <button type="submit" class="btn w-100 py-2 fw-bold text-white btn-connecter">
                                Se connecter
                            </button>
                        </form>

                        <div id="message-erreur" class="alert alert-danger mt-3 d-none" role="alert">
                            <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
                            Email ou mot de passe incorrect.
                        </div>

                        <footer class="text-center mt-4">
                            <p class="small text-muted mb-0">Vous n'avez pas de compte ?</p>
                            <a href="inscription.html" class="text-decoration-none fw-semibold lien-inscription">Creer un compte</a>
                        </footer>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/pages/connexion.js"></script>
</body>
</html>
