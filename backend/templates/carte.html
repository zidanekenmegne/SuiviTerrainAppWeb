{% extends "base.html" %}

{% block title %}Carte - SuiviTerrain{% endblock %}

{% block extra_css %}
<style>
    #map {
        height: 550px;
        width: 100%;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        z-index: 1;
    }
    .map-controls {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 15px;
    }
    .map-controls .filter-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
    }
    .map-controls .actions-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
    }
    .map-controls select,
    .map-controls input {
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #e0dcd6;
        font-family: 'Segoe UI', sans-serif;
        background: white;
    }
    .map-controls .btn-map {
        background-color: #8B0000;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .map-controls .btn-map:hover {
        background-color: #6a0000;
    }
    .map-controls .btn-map.btn-secondary {
        background-color: #6c757d;
    }
    .map-controls .btn-map.btn-secondary:hover {
        background-color: #5a6268;
    }
    .leaflet-popup-content {
        font-family: 'Segoe UI', sans-serif;
        min-width: 200px;
    }
    .leaflet-popup-content strong {
        color: #8B0000;
    }
    .leaflet-popup-content .popup-categorie {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 0.7rem;
        font-weight: 600;
        color: #fff;
        margin-top: 4px;
    }
    .custom-marker {
        background: none;
        border: none;
    }
    .user-marker {
        background: none;
        border: none;
    }
    .leaflet-routing-container {
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        padding: 10px;
        max-height: 300px;
        overflow-y: auto;
        font-family: 'Segoe UI', sans-serif;
    }
    .leaflet-routing-container .leaflet-routing-alt {
        max-height: 250px;
    }
    .leaflet-routing-container h2 {
        font-size: 14px;
        color: #8B0000;
    }
</style>
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h1><i class="bi bi-map" style="color: #8B0000;"></i> Carte des points de vente</h1>
</div>

<div class="map-controls">
    <!-- Filtres -->
    <div class="filter-group">
        <input type="text" id="searchPoint" placeholder="🔍 Nom du point..." 
               class="form-control" style="min-width: 150px; max-width: 200px;">
        
        <input type="date" id="filterDate" class="form-control" 
               style="max-width: 160px;" value="{{ today }}">
        
        <select id="filterCategorie" class="form-select" style="min-width: 140px; max-width: 180px;">
            <option value="">Toutes les catégories</option>
            {% for cat in categories %}
            <option value="{{ cat.id_cat }}">{{ cat.nom_cat }}</option>
            {% endfor %}
        </select>
        
        <select id="filterZone" class="form-select" style="min-width: 140px; max-width: 180px;">
            <option value="">Toutes les zones</option>
            {% for zone in zones %}
            <option value="{{ zone }}">{{ zone }}</option>
            {% endfor %}
        </select>
        
        <button class="btn-map" id="btnApplyFilters">
            <i class="bi bi-funnel"></i> Filtrer
        </button>
        <button class="btn-map btn-secondary" id="btnResetFilters">
            <i class="bi bi-arrow-counterclockwise"></i> Réinitialiser
        </button>
    </div>
    
    <!-- Actions -->
    <div class="actions-group">
        <button class="btn-map" id="btnGeolocate">
            <i class="bi bi-crosshair"></i> Ma position
        </button>
        <button class="btn-map" id="btnItineraire">
            <i class="bi bi-route"></i> Itinéraire du jour
        </button>
        <button class="btn-map btn-secondary" id="btnRefresh">
            <i class="bi bi-arrow-clockwise"></i> Actualiser
        </button>
    </div>
</div>

<div id="map"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // ==========================================================
        // INITIALISATION DE LA CARTE
        // ==========================================================
        const map = L.map('map').setView([4.051056, 9.767869], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            maxZoom: 19
        }).addTo(map);

        let markers = [];
        let userMarker = null;
        let allPoints = [];
        let userLat = null;
        let userLng = null;
        let routingControl = null;

        // ==========================================================
        // RÉCUPÉRER LES POINTS DEPUIS L'API
        // ==========================================================
        function loadPoints() {
            fetch('/api/v1/points?limit=100')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success' && data.data && data.data.points) {
                        allPoints = data.data.points;
                        displayPoints(allPoints);
                    } else {
                        console.error('Erreur de chargement des points');
                    }
                })
                .catch(error => console.error('Erreur:', error));
        }

        // ==========================================================
        // AFFICHER LES POINTS SUR LA CARTE
        // ==========================================================
        function displayPoints(points) {
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            const filterValue = document.getElementById('filterCategorie').value;

            points.forEach(point => {
                if (!point.latitude || !point.longitude) return;
                if (filterValue && point.categorie_id != filterValue) return;

                const color = point.couleur || '#6c757d';

                const icon = L.divIcon({
                    html: `<div style="background-color: ${color}; width: 24px; height: 24px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: 700;"><i class="bi bi-shop" style="font-size: 12px;"></i></div>`,
                    className: 'custom-marker',
                    iconSize: [30, 30],
                    iconAnchor: [15, 15],
                    popupAnchor: [0, -15]
                });

                const marker = L.marker([point.latitude, point.longitude], { icon: icon })
                    .addTo(map)
                    .bindPopup(`
                        <div style="padding: 4px;">
                            <strong>${point.nom}</strong>
                            <br><span style="color: #6c757d; font-size: 0.85rem;">${point.adresse}</span>
                            ${point.telephone ? `<br><i class="bi bi-telephone"></i> ${point.telephone}` : ''}
                            ${point.categorie ? `<br><span class="popup-categorie" style="background-color: ${color};">${point.categorie}</span>` : ''}
                            <br><a href="/points/modifier/${point.id}" style="color: #8B0000; font-weight: 600; text-decoration: none; margin-top: 4px; display: inline-block;">Voir les détails →</a>
                        </div>
                    `);

                markers.push(marker);
            });
        }

        // ==========================================================
        // GÉOLOCALISATION
        // ==========================================================
        document.getElementById('btnGeolocate').addEventListener('click', function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        userLat = position.coords.latitude;
                        userLng = position.coords.longitude;

                        console.log(`📍 Précision : ${position.coords.accuracy} mètres`);

                        if (userMarker) {
                            map.removeLayer(userMarker);
                        }

                        const userIcon = L.divIcon({
                            html: `<div style="background-color: #8B0000; width: 20px; height: 20px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.3);"><div style="width: 8px; height: 8px; background-color: #ffffff; border-radius: 50%; margin: 6px auto;"></div></div>`,
                            className: 'user-marker',
                            iconSize: [20, 20],
                            iconAnchor: [10, 10]
                        });

                        userMarker = L.marker([userLat, userLng], { icon: userIcon })
                            .addTo(map)
                            .bindPopup(`📍 Vous êtes ici<br><span style="font-size: 0.7rem; color: #6c757d;">Précision : ${position.coords.accuracy} m</span>`);

                        map.setView([userLat, userLng], 17);
                        userMarker.openPopup();
                    },
                    function(error) {
                        alert('Erreur de géolocalisation : ' + error.message);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 0
                    }
                );
            } else {
                alert('La géolocalisation n\'est pas supportée par votre navigateur.');
            }
        });

        // ==========================================================
        // FILTRES AVANCÉS
        // ==========================================================
        document.getElementById('btnApplyFilters').addEventListener('click', function() {
            const search = document.getElementById('searchPoint').value.trim();
            const categorie = document.getElementById('filterCategorie').value;
            const zone = document.getElementById('filterZone').value;
            
            let url = '/api/v1/points/filter?';
            if (search) url += `search=${encodeURIComponent(search)}&`;
            if (categorie) url += `categorie=${encodeURIComponent(categorie)}&`;
            if (zone) url += `zone=${encodeURIComponent(zone)}&`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success' && data.data) {
                        displayPoints(data.data);
                    }
                })
                .catch(error => console.error('Erreur:', error));
        });

        document.getElementById('btnResetFilters').addEventListener('click', function() {
            document.getElementById('searchPoint').value = '';
            document.getElementById('filterCategorie').value = '';
            document.getElementById('filterZone').value = '';
            loadPoints();
        });

        // ==========================================================
        // ACTUALISER
        // ==========================================================
        document.getElementById('btnRefresh').addEventListener('click', function() {
            loadPoints();
        });

        // ==========================================================
        // FILTRAGE DE L'ITINÉRAIRE PAR DATE
        // ==========================================================
        document.getElementById('filterDate').addEventListener('change', function() {
            const date = this.value;
            if (date) {
                chargerItineraire(date);
            }
        });

        // ==========================================================
        // ITINÉRAIRE DU JOUR (avec sessions Flask)
        // ==========================================================
        function chargerItineraire(dateParam) {
            const date = dateParam || new Date().toISOString().split('T')[0];
            
            fetch(`/api/v1/visites/jour?date=${date}`, {
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.status === 401 || response.status === 302) {
                    alert('Votre session a expiré. Veuillez vous reconnecter.');
                    window.location.href = '/auth/login';
                    return;
                }
                return response.json();
            })
            .then(data => {
                if (!data) return;

                if (data.status === 'success' && data.data && data.data.length > 0) {
                    const visites = data.data;

                    const waypointsData = visites
                        .filter(v => v.point_vente && v.point_vente.latitude && v.point_vente.longitude)
                        .map(v => ({
                            lat: v.point_vente.latitude,
                            lng: v.point_vente.longitude,
                            nom: v.point_vente.nom,
                            heure: v.heure_prevue ? v.heure_prevue.substring(0, 5) : '--:--'
                        }));

                    if (waypointsData.length < 2) {
                        alert('Il faut au moins 2 visites avec coordonnées GPS pour tracer un itinéraire.');
                        return;
                    }

                    let points = waypointsData.map(w => L.latLng(w.lat, w.lng));

                    if (userLat && userLng) {
                        points.unshift(L.latLng(userLat, userLng));
                    }

                    if (routingControl) {
                        map.removeControl(routingControl);
                    }

                    routingControl = L.Routing.control({
                        waypoints: points,
                        routeWhileDragging: true,
                        showAlternatives: true,
                        lineOptions: {
                            styles: [{ color: '#8B0000', weight: 4 }]
                        },
                        createMarker: function(i, wp) {
                            if (i === 0 && userLat && userLng) {
                                return L.marker(wp.latLng, {
                                    icon: L.divIcon({
                                        html: '<div style="background-color: #8B0000; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.3);"><div style="width: 6px; height: 6px; background-color: #ffffff; border-radius: 50%; margin: 5px auto;"></div></div>',
                                        className: 'user-marker',
                                        iconSize: [16, 16],
                                        iconAnchor: [8, 8]
                                    })
                                }).bindPopup('📍 Départ (vous)');
                            }

                            const idx = i - (userLat && userLng ? 1 : 0);
                            const waypoint = waypointsData[idx];

                            if (waypoint) {
                                return L.marker(wp.latLng, {
                                    icon: L.divIcon({
                                        html: `<div style="background-color: #007bff; width: 24px; height: 24px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: 700;">${i}</div>`,
                                        className: 'custom-marker',
                                        iconSize: [24, 24],
                                        iconAnchor: [12, 12]
                                    })
                                }).bindPopup(`<strong>${waypoint.nom}</strong><br>🕐 ${waypoint.heure}`);
                            }

                            return L.marker(wp.latLng);
                        }
                    }).addTo(map);

                    setTimeout(() => {
                        const bounds = routingControl.getPlan().getBounds();
                        if (bounds) {
                            map.fitBounds(bounds, { padding: [50, 50] });
                        }
                    }, 500);

                } else if (data.status === 'error') {
                    alert(data.message || 'Erreur lors du chargement des visites.');
                } else {
                    alert('Aucune visite planifiée pour cette date avec coordonnées GPS.');
                }
            })
            .catch(error => {
                console.error('Erreur:', error);
                alert('Erreur lors du chargement des visites.');
            });
        }

        document.getElementById('btnItineraire').addEventListener('click', function() {
            chargerItineraire();
        });

        // ==========================================================
        // INITIALISATION
        // ==========================================================
        loadPoints();
    });
</script>

{% endblock %}
