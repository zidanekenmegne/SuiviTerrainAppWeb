{% extends "base.html" %}

{% block title %}Modifier une catégorie - SuiviTerrain{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-primary-red text-white">
                <h4 class="mb-0"><i class="bi bi-pencil"></i> Modifier une catégorie</h4>
            </div>
            <div class="card-body">
                <form method="POST" id="modifierCategorieForm" action="{{ url_for('categories.modifier', id=categorie.id_cat) }}" novalidate>
                    <div class="mb-3">
                        <label for="nom" class="form-label">Nom *</label>
                        <input type="text" class="form-control" id="nom" name="nom" 
                               value="{{ categorie.nom_cat }}" required minlength="2"
                               aria-describedby="nomError">
                        <div id="nomError" class="invalid-feedback">Le nom doit contenir au moins 2 caractères.</div>
                    </div>

                    <div class="mb-3">
                        <label for="couleur" class="form-label">Couleur *</label>
                        <div class="d-flex align-items-center gap-3">
                            <input type="color" class="form-control form-control-color" id="couleur" 
                                   name="couleur" value="{{ categorie.couleur }}" style="width: 60px; height: 50px; padding: 0;"
                                   aria-describedby="couleurError" required>
                            <span id="couleurDisplay" class="badge" style="background-color: {{ categorie.couleur }}; color: #fff; padding: 8px 16px;">{{ categorie.couleur }}</span>
                        </div>
                        <div id="couleurError" class="invalid-feedback">Veuillez sélectionner une couleur.</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary-red">Enregistrer</button>
                        <a href="{{ url_for('categories.liste') }}" class="btn btn-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('modifierCategorieForm');
        const nom = document.getElementById('nom');
        const couleur = document.getElementById('couleur');

        document.getElementById('couleur').addEventListener('input', function() {
            document.getElementById('couleurDisplay').style.backgroundColor = this.value;
            document.getElementById('couleurDisplay').textContent = this.value;
            validateField(this, 'couleurError');
        });

        function validateField(input, errorId) {
            const errorEl = document.getElementById(errorId);
            if (input.validity.valid) {
                input.classList.remove('is-invalid');
                input.classList.add('is-valid');
                errorEl.style.display = 'none';
                return true;
            } else {
                input.classList.add('is-invalid');
                input.classList.remove('is-valid');
                errorEl.style.display = 'block';
                return false;
            }
        }

        nom.addEventListener('input', function() { validateField(this, 'nomError'); });
        couleur.addEventListener('input', function() { validateField(this, 'couleurError'); });

        form.addEventListener('submit', function(e) {
            const isNomValid = validateField(nom, 'nomError');
            const isCouleurValid = validateField(couleur, 'couleurError');

            if (!isNomValid || !isCouleurValid) {
                e.preventDefault();
                const firstInvalid = form.querySelector('.is-invalid');
                if (firstInvalid) firstInvalid.focus();
                return false;
            }
        });
    });
</script>

{% endblock %}
