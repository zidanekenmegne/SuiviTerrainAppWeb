{% extends "base.html" %}

{% block title %}Planifier une visite - SuiviTerrain{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header bg-primary-red text-white">
                <h4 class="mb-0"><i class="bi bi-calendar-plus"></i> Planifier une visite</h4>
            </div>
            <div class="card-body">
                <form method="POST" id="ajouterVisiteForm" novalidate>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="date_prevue" class="form-label">Date *</label>
                            <input type="date" class="form-control" id="date_prevue" name="date_prevue" required
                                   aria-describedby="dateError">
                            <div id="dateError" class="invalid-feedback">La date est obligatoire et ne peut pas être dans le passé.</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="heure_prevue" class="form-label">Heure *</label>
                            <input type="time" class="form-control" id="heure_prevue" name="heure_prevue" required
                                   aria-describedby="heureError">
                            <div id="heureError" class="invalid-feedback">L'heure est obligatoire.</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="point_vente" class="form-label">Point de vente *</label>
                        <select class="form-select" id="point_vente" name="point_vente" required
                                aria-describedby="pointError">
                            <option value="">Sélectionner un point de vente</option>
                            {% for point in points %}
                            <option value="{{ point.id_pt }}">{{ point.nom_pt }} - {{ point.adresse }}</option>
                            {% endfor %}
                        </select>
                        <div id="pointError" class="invalid-feedback">Veuillez sélectionner un point de vente.</div>
                    </div>

                    <div class="mb-3">
                        <label for="statut" class="form-label">Statut</label>
                        <select class="form-select" id="statut" name="statut">
                            <option value="planifiee">Planifiée</option>
                            <option value="encours">En cours</option>
                            <option value="realisee">Réalisée</option>
                            <option value="attente">En attente</option>
                            <option value="retard">En retard</option>
                            <option value="annulee">Annulée</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="compte_rendu" class="form-label">Compte rendu</label>
                        <textarea class="form-control" id="compte_rendu" name="compte_rendu" rows="3" 
                                  placeholder="Détails de la visite..."></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary-red">Planifier</button>
                        <a href="{{ url_for('list_visites') }}" class="btn btn-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('ajouterVisiteForm');
        const datePrevue = document.getElementById('date_prevue');
        const heurePrevue = document.getElementById('heure_prevue');
        const pointVente = document.getElementById('point_vente');

        function validateField(input, errorId) {
            const errorEl = document.getElementById(errorId);
            if (input.validity.valid) {
                input.classList.remove('is-invalid');
                input.classList.add('is-valid');
                errorEl.style.display = 'none';
                return true;
            } else {
                input.classList.add('is-invalid');
                input.classList.remove('is-valid');
                errorEl.style.display = 'block';
                return false;
            }
        }

        // Validation de la date (ne peut pas être dans le passé)
        function validateDate() {
            const dateValue = datePrevue.value;
            const today = new Date().toISOString().split('T')[0];
            if (dateValue && dateValue < today) {
                datePrevue.classList.add('is-invalid');
                datePrevue.classList.remove('is-valid');
                document.getElementById('dateError').style.display = 'block';
                return false;
            } else {
                datePrevue.classList.remove('is-invalid');
                datePrevue.classList.add('is-valid');
                document.getElementById('dateError').style.display = 'none';
                return true;
            }
        }

        datePrevue.addEventListener('input', function() {
            validateField(this, 'dateError');
            validateDate();
        });

        heurePrevue.addEventListener('input', function() { validateField(this, 'heureError'); });
        pointVente.addEventListener('change', function() { validateField(this, 'pointError'); });

        form.addEventListener('submit', function(e) {
            const isDateValid = validateDate();
            const isHeureValid = validateField(heurePrevue, 'heureError');
            const isPointValid = validateField(pointVente, 'pointError');

            if (!isDateValid || !isHeureValid || !isPointValid) {
                e.preventDefault();
                const firstInvalid = form.querySelector('.is-invalid');
                if (firstInvalid) firstInvalid.focus();
                return false;
            }
        });
    });
</script>

{% endblock %}
